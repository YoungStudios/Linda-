<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haarmode Linda Smout | Kapsalon in Essen</title>
    <meta name="description" content="Haarmode Linda Smout aan de Stationsstraat 215 in Essen. Persoonlijke haarverzorging voor dames, heren en kinderen. Bel voor een afspraak: 03 667 45 69.">
    <style>
        :root {
            --bg-cream: #FAF8F5;
            --bg-white: #FFFFFF;
            --bg-accent-soft: #F1ECE4;
            --primary: #5B6D5B;
            --primary-dark: #465646;
            --text-dark: #2C2C2C;
            --text-muted: #5F5F5F;
            --border-light: #E5DFD5;
            --holiday-bg: #FFF8E7;
            --holiday-border: #E6C888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            line-height: 1.6;
        }

        h1, h2, h3, .brand {
            font-family: Georgia, "Times New Roman", serif;
            font-weight: 600;
        }

        .container {
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background-color: var(--bg-white);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            max-width: 1040px;
            margin: 0 auto;
        }

        .brand {
            font-size: 1.3rem;
            color: var(--text-dark);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .btn {
            display: inline-block;
            background-color: var(--primary);
            color: #FFFFFF;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn-small {
            padding: 9px 16px;
            font-size: 0.9rem;
        }

        .hero {
            padding: 68px 20px 56px;
            text-align: center;
            background: linear-gradient(180deg, var(--bg-white) 0%, var(--bg-cream) 100%);
        }

        .hero-badge {
            display: inline-block;
            background-color: var(--bg-accent-soft);
            color: var(--primary-dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .hero h1 {
            font-size: 2.4rem;
            line-height: 1.25;
            max-width: 700px;
            margin: 0 auto 18px;
            color: var(--text-dark);
        }

        .hero p {
            font-size: 1.08rem;
            color: var(--text-muted);
            max-width: 620px;
            margin: 0 auto 30px;
        }

        .holiday-banner {
            background-color: var(--holiday-bg);
            border: 1px solid var(--holiday-border);
            border-radius: 12px;
            padding: 22px 26px;
            margin: 10px auto 40px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .holiday-icon {
            font-size: 1.6rem;
            line-height: 1.2;
        }

        .holiday-content h3 {
            font-size: 1.15rem;
            margin-bottom: 6px;
            color: #4A3B18;
        }

        .holiday-content p {
            font-size: 0.95rem;
            color: #5C4B24;
        }

        section {
            padding: 52px 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .section-header h2 {
            font-size: 1.95rem;
            margin-bottom: 10px;
        }

        .section-header p {
            color: var(--text-muted);
            max-width: 580px;
            margin: 0 auto;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }

        .feature-card {
            background-color: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 26px;
        }

        .feature-card h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--primary-dark);
        }

        .feature-card p {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .services-section {
            background-color: var(--bg-white);
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
        }

        .price-card {
            max-width: 720px;
            margin: 0 auto;
            background-color: var(--bg-cream);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 12px 28px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-light);
            gap: 12px;
        }

        .price-row:last-child {
            border-bottom: none;
        }

        .service-name {
            font-weight: 600;
            color: var(--text-dark);
        }

        .service-desc {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .service-price {
            font-weight: 600;
            color: var(--primary-dark);
            background-color: var(--bg-white);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-light);
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 32px;
        }

        .info-box {
            background-color: var(--bg-white);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 30px;
        }

        .info-box h3 {
            font-size: 1.35rem;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-light);
        }

        .hours-list {
            list-style: none;
        }

        .hours-list li {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.95rem;
            border-bottom: 1px dashed var(--border-light);
        }

        .hours-list li:last-child {
            border-bottom: none;
        }

        .note-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 14px;
        }

        .contact-item {
            margin-bottom: 16px;
            font-size: 0.98rem;
        }

        .contact-item strong {
            display: block;
            color: var(--text-dark);
            margin-bottom: 2px;
        }

        .contact-item a {
            color: var(--primary-dark);
            font-weight: 600;
            text-decoration: none;
        }

        .amenities {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }

        .amenity-tag {
            background-color: var(--bg-accent-soft);
            color: var(--text-dark);
            font-size: 0.82rem;
            padding: 5px 11px;
            border-radius: 6px;
            font-weight: 500;
        }

        .map-box {
            margin-top: 22px;
            background-color: var(--bg-accent-soft);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }

        .map-box a {
            color: var(--primary-dark);
            font-weight: 600;
            text-decoration: none;
        }

        .demo-notice {
            background-color: var(--primary-dark);
            color: #FFFFFF;
            text-align: center;
            padding: 14px 20px;
            font-size: 0.88rem;
        }

        footer {
            background-color: var(--bg-white);
            border-top: 1px solid var(--border-light);
            padding: 28px 20px;
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        @media (max-width: 680px) {
            .nav-links {
                display: none;
            }
            .hero h1 {
                font-size: 1.9rem;
            }
            .holiday-banner {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-wrapper">
            <a href="#" class="brand">Haarmode Linda Smout</a>
            <ul class="nav-links">
                <li><a href="#over-ons">Over ons</a></li>
                <li><a href="#diensten">Diensten</a></li>
